type: review
description: Design/architecture review. Survey code and docs -> synthesize judgment -> technical rebuttal and check against requirements
default_mode: full
stages:
  recon:
    parallel: by_area
    model: codex-medium-h
    purpose: explore
    notes: Use gemini-medium-m(web) for external docs and case studies
  produce:
    model: claude-high-m
    purpose: synthesis
  verify:
    start: after_produce
    lanes:
      critical: { model: other_family(author), pane: false, required: true }
      neutral: { model: gemini-medium-m, pane: false, required: false, when: "user_facing || mode == full+", withhold: [self_assessment] }
  integrate:
    owner: head
retry_limit: 2

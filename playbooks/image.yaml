type: image
description: Image generation. Analyze references -> generate with Codex image_generation -> check against requirements and review visual quality
default_mode: light
stages:
  recon:
    model: gemini-medium-m
    purpose: web
    notes: Summarize references, style, and constraints
  produce:
    model: codex-high-m
    purpose: image
    notes: Use Codex's built-in image_generation tool (D4). Specify the output path in the contract
  verify:
    start: after_produce
    lanes:
      neutral: { model: gemini-medium-m, pane: false, required: true, withhold: [self_assessment] }
      critical: { model: other_family(author), pane: false, required: true }
  integrate:
    owner: head
retry_limit: 2

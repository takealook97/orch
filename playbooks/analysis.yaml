type: analysis
description: Data analysis. Extract -> compute/interpret -> recompute and challenge the interpretation
default_mode: full
stages:
  recon:
    parallel: by_source
    model: codex-medium-h
    purpose: extract
  produce:
    model: codex-high-m
    purpose: analysis
    escalate_to: claude-high-m
    escalate_when: ["ambiguous_interpretation", "causal_claim"]
  verify:
    start: after_produce
    lanes:
      mechanical: { run: true, model: codex-medium-h, required: true }
      critical: { model: other_family(author), pane: false, required: true }
      neutral: { model: gemini-medium-m, pane: false, required: false, withhold: [self_assessment] }
  integrate:
    owner: head
retry_limit: 2

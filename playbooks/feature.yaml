type: feature
description: Feature development. Recon by area -> (design) -> implement per worktree -> verify per shard -> integrate
default_mode: full
stages:
  recon:
    parallel: by_area
    model: codex-medium-h
    purpose: explore
    output: results/recon-<area>.md
  design:
    when: "ambiguous || cross_module"
    model: claude-high-m
    purpose: synthesis
    notes: Lock interfaces and names in decisions.md first (parallel-write gate 3)
  design_check:
    when: "design ran && mode == full+"
    model: codex-high-m
    purpose: verify-critical
    notes: "5-10 min pre-implementation challenge of decisions.md by a family other than the designer: missing requirements, conflicts with the existing system, needless abstraction, migration risk, rollback path. No code review."
  produce:
    parallel: by_worktree
    model: codex-high-l
    purpose: mech-impl
    escalate_to: codex-high-m
    escalate_when: ["failed_once", "cross_cutting"]
    notes: Write a file-level plan into each shard contract so codex-high-l can run it; use codex-high-m(impl) when the shard needs its own design choices; start with claude-high-m(hard-impl) for concurrency, security, or complex state
  verify:
    start: per_shard
    lanes:
      mechanical: { model: codex-medium-h, required: true }
      critical: { model: other_family(author), required: true }
      neutral: { model: gemini-medium-m, required: false, when: "user_facing || mode == full+", withhold: [self_assessment] }
      adversarial: { model: "other_family(author, critical)", when: "mode == full+" }
  integrate:
    owner: head
    mechanics: head
    escalate_to: codex-high-m
    notes: "Clean merge: Head runs git merge and orch test directly, no model. Textual conflicts: codex-high-m. Semantic conflicts: claude-high-m. Merge one worktree at a time; full test suite after each merge."
retry_limit: 2

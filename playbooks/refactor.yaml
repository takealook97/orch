type: refactor
description: Refactoring. Survey the blast radius -> opus-m for the core, sol-l in parallel for mechanical shards -> verify behavior stays identical
default_mode: full
stages:
  recon:
    parallel: by_area
    model: luna-m
    purpose: explore
  design:
    model: opus-m
    purpose: synthesis
  produce:
    parallel: by_worktree
    model: opus-m
    purpose: hard-impl
    mechanics: sol-l
    notes: Use opus-m for core changes; use sol-l per shard (mech-impl) for applying repetitive patterns
  verify:
    start: per_shard
    lanes:
      mechanical: { model: luna-h, required: true }
      critical: { model: other_family(author), required: true }
      adversarial: { model: "other_family(author, critical)", when: "mode == full+" }
  integrate:
    owner: head
    mechanics: sol-m
retry_limit: 2

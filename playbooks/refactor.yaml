type: refactor
description: Refactoring. Survey the blast radius -> claude-high-m for the core, codex-high-l in parallel for mechanical shards -> verify behavior stays identical
default_mode: full
stages:
  recon:
    parallel: by_area
    model: codex-medium-h
    purpose: explore
  design:
    model: claude-high-m
    purpose: synthesis
  design_check:
    when: "design ran && mode == full+"
    model: codex-high-m
    purpose: verify-critical
    notes: "5-10 min pre-implementation challenge of decisions.md by a family other than the designer: missing requirements, conflicts with the existing system, needless abstraction, migration risk, rollback path. No code review."
  produce:
    parallel: by_worktree
    model: claude-high-m
    purpose: hard-impl
    mechanics: codex-high-l
    notes: Use claude-high-m for core changes; use codex-high-l per shard (mech-impl) for applying repetitive patterns
  verify:
    start: per_shard
    lanes:
      mechanical: { model: codex-medium-h, required: true }
      critical: { model: other_family(author), required: true }
      adversarial: { model: "other_family(author, critical)", when: "mode == full+" }
  integrate:
    owner: head
    mechanics: head
    escalate_to: codex-high-m
    notes: "Clean merge: Head runs git merge and orch test directly, no model. Textual conflicts: codex-high-m. Semantic conflicts: claude-high-m. Merge one worktree at a time; full test suite after each merge."
retry_limit: 2
